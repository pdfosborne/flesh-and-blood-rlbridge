# Talishar game server + FAB RL Bridge web GUI
name: fab-rl-bridge

include:
  - path: ./Talishar/docker-compose.yml

services:
  web-server:
    volumes:
      - ./docker/talishar:/fab-bridge-stubs:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/www/html/game/Games /var/www/html/game/HostFiles /var/www/html/game/APIKeys
        cp -n /var/www/html/game/HostFiles/RedirectorTemplate.php /var/www/html/game/HostFiles/Redirector.php
        if [ ! -f /var/www/html/game/HostFiles/GameIDCounter.txt ]; then
          echo "1" > /var/www/html/game/HostFiles/GameIDCounter.txt
        fi
        chmod 666 /var/www/html/game/HostFiles/GameIDCounter.txt
        chmod 1777 /var/www/html/game/Games
        if [ ! -f /var/www/html/game/APIKeys/APIKeys.php ]; then
          cp /fab-bridge-stubs/APIKeys.local.php /var/www/html/game/APIKeys/APIKeys.php
        fi
        chmod 644 /var/www/html/game/APIKeys/APIKeys.php
        exec apache2-foreground

  # Clone Talishar-FE into the repo checkout on first compose up
  talishar-fe-clone:
    image: alpine/git:2.49.0
    profiles:
      - full
    volumes:
      - ./:/repo
    working_dir: /repo
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f Talishar-FE/package.json ]; then
          echo "Cloning Talishar-FE..."
          git clone --depth 1 https://github.com/Talishar/Talishar-FE Talishar-FE
        fi
    restart: "no"

  talishar-fe:
    profiles:
      - full
    build:
      context: .
      dockerfile: docker/talishar-fe/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./Talishar-FE:/app
      - talishar_fe_node_modules:/app/node_modules
      - ./docker/talishar-fe/talishar-fe.env:/config/talishar-fe.env:ro
    depends_on:
      talishar-fe-clone:
        condition: service_completed_successfully
      web-server:
        condition: service_started
    restart: unless-stopped

  fab-bridge:
    build:
      context: .
      dockerfile: docker/fab-bridge/Dockerfile
      args:
        TORCH_CUDA: "0"
    ports:
      - "8765:8765"
    environment:
      FAB_BRIDGE_HOME: /app
      # Same compose stack as web-server so deck files in Talishar/Assets are visible to PHP
      TALISHAR_URL: http://web-server/game
      TALISHAR_FE_URL: http://talishar-fe:5173
      TALISHAR_ASSETS_PATH: /app/Talishar/Assets
    volumes:
      - ./results:/app/results
      - ./Talishar:/app/Talishar
    depends_on:
      web-server:
        condition: service_started
      talishar-fe:
        condition: service_healthy
    restart: unless-stopped

  # Ensure host fab-* wrappers in bin/ are executable after compose up --build
  fab-cli-setup:
    image: busybox:1.36
    volumes:
      - ./:/repo
    working_dir: /repo
    entrypoint:
      - /bin/sh
      - -c
      - chmod +x bin/fab-* 2>/dev/null; exit 0
    depends_on:
      fab-bridge:
        condition: service_started
    restart: "no"

  # Prints the ready message after the full stack is up (visible in `docker compose up` logs)
  setup-complete:
    profiles:
      - full
    image: curlimages/curl:8.12.0
    volumes:
      - ./docker/ready-message.txt:/ready-message.txt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      fab-bridge:
        condition: service_started
      talishar-fe:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        for url in \
          http://host.docker.internal:8080/ \
          http://host.docker.internal:5173/ \
          http://host.docker.internal:8765/; do
          ok=0
          for _ in $$(seq 1 120); do
            if curl -fsS --max-time 2 "$$url" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$$ok" -eq 0 ]; then
            echo "[setup-complete] warning: $$url not reachable yet"
          fi
        done
        cat /ready-message.txt
    restart: "no"

volumes:
  talishar_fe_node_modules:
