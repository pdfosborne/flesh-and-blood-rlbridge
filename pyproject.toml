[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flesh-and-blood-rlbridge"
version = "0.1.0"
description = "Talishar-inspired Flesh and Blood TCG environments for RL Bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rlbridge Contributors" }]
keywords = ["reinforcement-learning", "rlbridge", "flesh-and-blood", "tcg", "card-game"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Board Games",
]

dependencies = [
    "rlbridge>=0.1.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "playwright>=1.46.0",
    "matplotlib>=3.7.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gui = ["torch"]
eval = ["torch", "pybind11"]
train = ["torch"]
cpp = ["pybind11"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
all = [
    "flesh-and-blood-rlbridge[gui,train,cpp,eval]",
]

[project.scripts]
fab-bridge = "fab_bridge.cli:main"
fab-gui = "fab_bridge.cli:gui_main"
fab-tui = "fab_bridge.cli:tui_main_entry"

[project.entry-points."rlbridge.environments"]
flesh-and-blood = "flesh_and_blood_rlbridge:register_environments"

[project.entry-points."rlbridge.environment_mcp_tools"]
flesh-and-blood = "flesh_and_blood_rlbridge:register_mcp_tools"

[project.urls]
Homepage = "https://github.com/pdfosborne/flesh-and-blood-rlbridge"
Repository = "https://github.com/pdfosborne/flesh-and-blood-rlbridge"
Issues = "https://github.com/pdfosborne/flesh-and-blood-rlbridge/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "src/flesh_and_blood_rlbridge",
    "fab_bridge",
    "fab_tui",
    "fab_gui",
    "rl_agents",
]

[tool.hatch.build.targets.wheel.force-include]
"runtime_defaults.py" = "runtime_defaults.py"
"scripts" = "scripts"
"runscripts" = "runscripts"
"start_talishar.py" = "start_talishar.py"
"agents/manifest.json" = "agents/manifest.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "fab_bridge/",
    "fab_tui/",
    "fab_gui/",
    "rl_agents/",
    "scripts/",
    "runscripts/",
    "runtime_defaults.py",
    "start_talishar.py",
    "docker/",
    "docker-compose.yml",
    "docker-compose.eval.yml",
    "agents/",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "scripts",
    "scripts/training",
    "scripts/eval",
    "scripts/cpp",
    "scripts/deck",
    "src",
]

[tool.ruff]
target-version = "py310"
line-length = 100
