[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flesh-and-blood-rlbridge"
version = "0.1.0"
description = "Talishar-inspired Flesh and Blood TCG environments for RL Bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rlbridge Contributors" }]
keywords = ["reinforcement-learning", "rlbridge", "flesh-and-blood", "tcg", "card-game"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Board Games",
]

dependencies = [
    "rlbridge>=0.1.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "playwright>=1.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
fab-play = "flesh_and_blood_rlbridge.cli:main"

[project.entry-points."rlbridge.environments"]
flesh-and-blood = "flesh_and_blood_rlbridge:register_environments"

[project.entry-points."rlbridge.environment_mcp_tools"]
flesh-and-blood = "flesh_and_blood_rlbridge:register_mcp_tools"

[project.urls]
Homepage = "https://github.com/pdfosborne/flesh-and-blood-rlbridge"
Repository = "https://github.com/pdfosborne/flesh-and-blood-rlbridge"
Issues = "https://github.com/pdfosborne/flesh-and-blood-rlbridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/flesh_and_blood_rlbridge"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
